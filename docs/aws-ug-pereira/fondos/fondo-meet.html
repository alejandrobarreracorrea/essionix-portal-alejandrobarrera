<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#151D25}
.bg{position:absolute;inset:0;background:url(../assets/background.png) right center/auto 100% no-repeat,#151D25}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#151D25 0%,#151D25 30%,rgba(21,29,37,.55) 52%,rgba(21,29,37,0) 70%)}
.grid{position:absolute;left:0;top:0;width:640px;height:1080px;opacity:.5;
  background-image:linear-gradient(90deg,rgba(172,91,255,.10) 1px,transparent 1px),linear-gradient(rgba(172,91,255,.10) 1px,transparent 1px);background-size:80px 80px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.logo{position:absolute;left:96px;top:86px;width:300px}
.cap{position:absolute;left:100px;top:222px;font:800 64px/1 "Plus Jakarta Sans",system-ui;color:#fff;letter-spacing:-.02em}
.cap span{display:block;font:500 22px/1.4 Inter,system-ui;color:#aab6c2;letter-spacing:0;margin-top:14px}
.bar{position:absolute;left:100px;top:360px;width:120px;height:5px;border-radius:3px;background:linear-gradient(90deg,#AC5BFF,#41B3FF)}
.badge{position:absolute;right:120px;top:210px;width:360px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
.city{position:absolute;left:0;right:0;bottom:-6px;height:230px;opacity:.55;background:url(../assets/cityscapes/Usergroups-cityscapes_1.svg) left bottom/auto 100% repeat-x}
.meet{position:absolute;left:100px;bottom:250px;font:500 22px/1.3 "JetBrains Mono",monospace;color:#AC5BFF}
.meet b{color:#fff;font-weight:500}
.spk{position:absolute;left:100px;bottom:292px;display:none}
.spk .n{font:700 34px/1.1 "Plus Jakarta Sans",system-ui;color:#fff}
.spk .r{font:500 21px/1.4 Inter,system-ui;color:#FF9900;margin-top:6px}
body.speaker .spk{display:block}
</style>
<div class="bg"></div><div class="fade"></div><div class="grid"></div>
<img class="logo" src="../assets/logo/logo-dark.svg" alt="">
<div class="cap">Pereira<span>Comunidad de AWS · Colombia</span></div>
<div class="bar"></div>
<img class="badge" src="../assets/pereira-badge.jpg" alt="">
<div class="spk"><div class="n">Alejandro Barrera</div><div class="r">Cloud Architect · Speaker</div></div>
<div class="meet">meetup.com/<b>aws-user-group-pereira</b></div>
<div class="city"></div>
<script>if(location.hash==='#speaker')document.body.classList.add('speaker')</script>
