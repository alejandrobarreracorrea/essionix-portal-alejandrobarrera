<!DOCTYPE html>
<!-- Banner LinkedIn 1584×396. Abrir en Chrome → screenshot del área exacta (o pedir a Claude que lo renderice). -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #333; }
  /* SAFE ZONE: la foto de perfil de LinkedIn tapa aprox. el 25% izquierdo-inferior
     del banner en desktop (y algo más en móvil). Todo el contenido importante vive
     a la derecha de x=440px. La franja izquierda queda solo decorativa. */
  .banner {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    background: #08080b; font-family: "Space Grotesk", sans-serif; color: #f5f5f7;
    display: flex; align-items: center; padding: 0 90px 0 440px;
  }
  .aura {
    position: absolute; inset: -40% -10%;
    background:
      radial-gradient(40% 55% at 82% 20%, rgba(139,123,255,.38), transparent 70%),
      radial-gradient(35% 50% at 12% 80%, rgba(56,224,216,.22), transparent 70%),
      radial-gradient(25% 40% at 55% 50%, rgba(255,122,217,.10), transparent 70%);
    filter: blur(10px);
  }
  .grid-lines { position: absolute; inset: 0; opacity: .05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 44px 44px; }
  .content { position: relative; z-index: 2; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: .08em;
    color: #9a8cff; text-transform: uppercase; margin-bottom: 18px; }
  .eyebrow .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: linear-gradient(135deg, #8b7bff, #38e0d8); margin-right: 10px; vertical-align: middle;
    box-shadow: 0 0 14px 2px rgba(56,224,216,.6); }
  h1 { font-size: 74px; font-weight: 700; letter-spacing: -.03em; line-height: 1.02; }
  h1 .accent { background: linear-gradient(100deg, #8b7bff, #38e0d8 60%, #ff7ad9);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { position: absolute; right: 90px; bottom: 48px; z-index: 2; text-align: right;
    font-family: "JetBrains Mono", monospace; font-size: 19px; color: #9c9caa; line-height: 1.9; }
  .meta b { color: #f5f5f7; font-weight: 500; }
  .badges { position: absolute; right: 90px; top: 52px; z-index: 2;
    font-family: "JetBrains Mono", monospace; font-size: 17px; color: #66666f; letter-spacing: .05em; }
</style>
</head>
<body>
  <div class="banner">
    <div class="aura"></div>
    <div class="grid-lines"></div>
    <!-- decor de la franja izquierda (zona que tapa la foto): solo ornamental -->
    <div style="position:absolute; left:120px; top:38px; width:210px; height:210px; border-radius:50%;
                border:1px dashed rgba(154,140,255,.35); z-index:1;"></div>
    <div style="position:absolute; left:96px; top:14px; width:258px; height:258px; border-radius:50%;
                border:1px solid rgba(56,224,216,.14); z-index:1;"></div>
    <div class="content">
      <div class="eyebrow"><span class="dot"></span>IAOps · AI SRE en español</div>
      <h1>Deja de operar la nube.<br><span class="accent">Empieza a dirigirla.</span></h1>
    </div>
    <div class="badges">AWS · OCI · AZURE</div>
    <div class="meta"><b>14x certified</b> · 10+ años<br><b>alejandrobarrera.net</b></div>
  </div>
</body>
</html>
