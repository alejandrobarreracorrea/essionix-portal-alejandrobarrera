<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clase — IAOps LATAM</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#08080b" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-endpoint="__REGISTER_ENDPOINT__">
  <header class="nav">
    <div class="shell nav__inner">
      <a class="nav__brand" href="/">IAOps <b>LATAM</b></a>
      <nav class="nav__links">
        <a href="/app/">Mi aprendizaje</a>
        <a href="/cursos/" class="is-current">Cursos</a>
        <a href="/programa/">Programa</a>
      </nav>
      <div class="navgroup">
        <a class="signin" id="logout" href="/">Salir</a>
        <span class="avatar" id="avatar">·</span>
      </div>
    </div>
  </header>
  <main class="shell page">
    <div id="player" class="is-hidden">
      <span class="kicker" id="cl-kicker"></span>
      <h1 style="font-size: clamp(1.6rem, 3.6vw, 2.3rem);" id="cl-title"></h1>
      <div class="video" id="cl-video">
        <div style="text-align: center;">
          <div class="play">▶</div>
          <span id="cl-video-note"></span>
        </div>
      </div>
      <div class="mision">
        <span class="k">Tu misión</span>
        <p id="cl-mision"></p>
      </div>
      <div class="actions">
        <a class="btn btn--primary" id="cl-done" href="#">Marcar completada ✓</a>
        <a class="btn btn--ghost" id="cl-next" href="/app/">Siguiente →</a>
        <span class="privacy" id="cl-done-note"></span>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="shell footer__inner">
      <span>© <span id="year">2026</span> IAOps LATAM · <a href="https://alejandrobarrera.net" target="_blank" rel="noopener">el fundador</a></span>
      <span>La IA ejecuta. Tú diriges.</span>
    </div>
  </footer>
  <script src="/catalog.js"></script>
  <script src="/app.js"></script>
</body>
</html>
